[project]
name = "miniserve"
version = "0.1.0"
description = "Educational, benchmarkable LLM text-generation server: scheduling, streaming, caching, measurement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD - see LICENSE_NOTES.md" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
hf = [
    "torch>=2.3",
    "transformers>=4.45",
    "safetensors>=0.4",
]

[project.scripts]
miniserve = "miniserve.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "torch: needs torch + transformers installed (tiny random model, no downloads)",
    "real_model: downloads/loads the real HF model; opt-in via MINISERVE_RUN_REAL_MODEL_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["miniserve"]
known-local-folder = ["conftest"]
